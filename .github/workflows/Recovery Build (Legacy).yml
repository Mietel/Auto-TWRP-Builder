name: Recovery Build (Legacy)

on:
  workflow_dispatch:
    inputs:
      IMG_URL:
        description: 'IMG_ URL'
        required: true
        default: 'https://github.com/Mietel/Auto-TWRP-Builder/releases/download/ultra-input/recovery-input.zip'
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-14.1'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'boot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v4
    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      # That's it! Now use your normal steps

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python3
        sudo apt -y install python3 python3-pip cpio wget
        pip3 install twrpdtgen
    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.5.4
      with:
          ssh-private-key: |
              ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "azwhikaru"
        git config --global user.email "azwhikaru+37921907@github.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd

    - name: Check Build Tree
      uses: haya14busa/action-cond@v1
      id: buildtree
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: twrp
        if_false: omni


    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace
    - name: Generate Device Tree
      run: |
        set -euo pipefail
        wget -O input.zip "${{ github.event.inputs.IMG_URL }}"
        unzip -o input.zip
        mapfile -t IMAGES < <(find . -maxdepth 1 -type f -iname '*.img' -print)
        if [ "${#IMAGES[@]}" -ne 1 ]; then
          echo "Expected exactly one input image, found ${#IMAGES[@]}:"
          printf ' - %s\n' "${IMAGES[@]}"
          exit 1
        fi
        python3 ${GITHUB_WORKSPACE}/scripts/build.py -i "${IMAGES[0]}" -o device
        # twrpdtgen emits a removed Android build variable on newer manifests.
        grep -RIl 'PRODUCT_STATIC_BOOT_CONTROL_HAL' device | xargs -r sed -i '/PRODUCT_STATIC_BOOT_CONTROL_HAL/,/^$/d'
        # Convert the generator's legacy Omni product to the TWRP product used by the selected manifest.
        DEVICE_TREE=$(dirname "$(find device -name AndroidProducts.mk -print -quit)")
        test -n "$DEVICE_TREE" && test -f "$DEVICE_TREE/AndroidProducts.mk"
        for f in "$DEVICE_TREE"/omni_*.mk; do
          [ -e "$f" ] || continue
          mv "$f" "${f/omni_/twrp_}"
        done
        find "$DEVICE_TREE" -type f -print0 | xargs -0 sed -i \
          -e 's/omni_/twrp_/g' \
          -e 's@vendor/omni@vendor/twrp@g'
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      id: gdt

    - name: Sync Device Dependencies
      run: |
        set -euo pipefail
        DEPENDENCIES="${{ steps.gdt.outputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies"
        if [ -f "$DEPENDENCIES" ]; then
          bash ${GITHUB_WORKSPACE}/scripts/convert.sh "$DEPENDENCIES"
        else
          echo "No device dependencies file found; continuing with the manifest dependencies."
        fi
        repo sync -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Ensure Guava dependency
      run: |
        set -euo pipefail
        repo sync -j$(nproc --all) --force-sync external/guava external/jsr305
        test -f external/guava/Android.bp
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        set -euo pipefail
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        DEVICE_TREE=$(dirname "$(find device -name AndroidProducts.mk -print -quit)")
        PRODUCT_NAME=$(sed -n 's|.*$(LOCAL_DIR)/\([^[:space:]]*\)\.mk.*|\1|p' "$DEVICE_TREE/AndroidProducts.mk" | head -n 1)
        test -n "$PRODUCT_NAME"
        if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == twrp-* ]]; then
          if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "twrp-14.1" ]]; then
            lunch "$PRODUCT_NAME-ap2a-eng"
          else
            lunch "$PRODUCT_NAME-eng"
          fi
        else
          lunch "$PRODUCT_NAME-eng"
        fi
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: | 
          workspace/out/target/product/${{ steps.gdt.outputs.PRODUCT_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ steps.gdt.outputs.PRODUCT_NAME }}/*.zip
          workspace/out/target/product/${{ steps.gdt.outputs.PRODUCT_NAME }}/*vendor*.img
        name: ${{ steps.gdt.outputs.PRODUCT_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ steps.gdt.outputs.PRODUCT_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
