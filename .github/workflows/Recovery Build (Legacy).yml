name: Recovery Build (Legacy)

on:
  workflow_dispatch:
    inputs:
      IMG_URL:
        description: 'IMG_ URL'
        required: true
        default: 'https://github.com/Mietel/Auto-TWRP-Builder/releases/download/ultra-input/recovery-input.zip'
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-14.1'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'boot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ALLOW_MISSING_DEPENDENCIES: 'true'
      BUILD_BROKEN_MISSING_REQUIRED_MODULES: 'true'
      SOONG_ALLOW_MISSING_DEPENDENCIES: 'true'
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v4
    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python3
        sudo apt -y install python3 python3-pip cpio wget
        pip3 install twrpdtgen
    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.5.4
      with:
          ssh-private-key: |
              ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "azwhikaru"
        git config --global user.email "azwhikaru+37921907@github.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd

    - name: Check Build Tree
      id: buildtree
      run: |
        if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == twrp-* ]]; then
          echo "value=twrp" >> "$GITHUB_OUTPUT"
        else
          echo "value=omni" >> "$GITHUB_OUTPUT"
        fi


    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace
    - name: Generate Device Tree
      run: |
        set -euo pipefail
        wget -O input.zip "${{ github.event.inputs.IMG_URL }}"
        unzip -o input.zip
        mapfile -t IMAGES < <(find . -maxdepth 1 -type f -iname '*.img' -print)
        if [ "${#IMAGES[@]}" -ne 1 ]; then
          echo "Expected exactly one input image, found ${#IMAGES[@]}:"
          printf ' - %s\n' "${IMAGES[@]}"
          exit 1
        fi
        python3 ${GITHUB_WORKSPACE}/scripts/build.py -i "${IMAGES[0]}" -o device
        # twrpdtgen emits a removed Android build variable on newer manifests.
        grep -RIl 'PRODUCT_STATIC_BOOT_CONTROL_HAL' device | xargs -r sed -i '/PRODUCT_STATIC_BOOT_CONTROL_HAL/,/^$/d'
        # Convert the generator's legacy Omni product to the TWRP product used by the selected manifest.
        DEVICE_TREE=$(dirname "$(find device -name AndroidProducts.mk -print -quit)")
        test -n "$DEVICE_TREE" && test -f "$DEVICE_TREE/AndroidProducts.mk"
        for f in "$DEVICE_TREE"/omni_*.mk; do
          [ -e "$f" ] || continue
          mv "$f" "${f/omni_/twrp_}"
        done
        find "$DEVICE_TREE" -type f -print0 | xargs -0 sed -i \
          -e 's/omni_/twrp_/g' \
          -e 's@vendor/omni@vendor/twrp@g'
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      id: gdt

    - name: Sync Device Dependencies
      run: |
        set -euo pipefail
        DEPENDENCIES="${{ steps.gdt.outputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies"
        if [ -f "$DEPENDENCIES" ]; then
          bash ${GITHUB_WORKSPACE}/scripts/convert.sh "$DEPENDENCIES"
        else
          echo "No device dependencies file found; continuing with the manifest dependencies."
        fi
        repo sync -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        set -euo pipefail
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export BUILD_BROKEN_MISSING_REQUIRED_MODULES=true
        export SOONG_ALLOW_MISSING_DEPENDENCIES=true
        DEVICE_TREE=$(dirname "$(find device -name AndroidProducts.mk -print -quit)")
        PRODUCT_NAME=$(sed -n 's|.*$(LOCAL_DIR)/\([^[:space:]]*\)\.mk.*|\1|p' "$DEVICE_TREE/AndroidProducts.mk" | head -n 1)
        test -n "$PRODUCT_NAME"
        if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == twrp-* ]]; then
          if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "twrp-14.1" ]]; then
            lunch "$PRODUCT_NAME-ap2a-eng"
          else
            lunch "$PRODUCT_NAME-eng"
          fi
        else
          lunch "$PRODUCT_NAME-eng"
        fi
        make ${{ github.event.inputs.BUILD_TARGET }}image -j"$(nproc --all)" 2>&1 | tee build.log
        PRODUCT_OUTPUT="out/target/product/${{ steps.gdt.outputs.MAKEFILE_NAME }}"
        IMAGE_PATH="$PRODUCT_OUTPUT/${{ github.event.inputs.BUILD_TARGET }}.img"
        test -s "$IMAGE_PATH"
        if [[ "${{ github.event.inputs.BUILD_TARGET }}" == "boot" ]]; then
          PARTITION_SIZE=$(awk '$1 == "BOARD_BOOTIMAGE_PARTITION_SIZE" {print $3; exit}' "$DEVICE_TREE/BoardConfig.mk")
          STOCK_IMAGE=$(find . -maxdepth 1 -type f -iname '*.img' -print -quit)
          test -n "$STOCK_IMAGE"
          python3 - "$STOCK_IMAGE" "$IMAGE_PATH" "$PARTITION_SIZE" <<'PY'
        import struct
        import sys
        from pathlib import Path

        stock_image = Path(sys.argv[1])
        image = Path(sys.argv[2])
        partition_size = int(sys.argv[3]) if sys.argv[3].isdigit() else None
        stock_data = stock_image.read_bytes()
        data = image.read_bytes()
        if data[:8] != b"ANDROID!":
            raise SystemExit("Output is not an Android boot image")
        page_size = struct.unpack_from("<I", data, 36)[0]
        header_version = struct.unpack_from("<I", data, 40)[0]
        if page_size != 2048:
            raise SystemExit(f"Unexpected boot page size: {page_size}")
        if header_version != 2:
            raise SystemExit(f"Unexpected boot header version: {header_version}")
        if partition_size is not None and image.stat().st_size > partition_size:
            raise SystemExit(
                f"Image is {image.stat().st_size} bytes, boot partition is {partition_size} bytes"
            )
        stock_has_avb = len(stock_data) >= 64 and stock_data[-64:-60] == b"AVBf"
        output_has_avb = len(data) >= 64 and data[-64:-60] == b"AVBf"
        if stock_has_avb != output_has_avb:
            raise SystemExit(
                f"AVB footer mismatch: stock={stock_has_avb}, output={output_has_avb}"
            )
        print(
            f"Validated Android boot image: {image} ({image.stat().st_size} bytes); "
            f"AVB footer preserved={output_has_avb}"
        )
        PY
        fi
        echo "Built image: $IMAGE_PATH"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload build diagnostics
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: build-diagnostics-${{ github.run_id }}
        if-no-files-found: ignore
        path: |
          workspace/build.log
          workspace/out/soong.log
          workspace/out/soong/soong.log
          workspace/out/.ninja_log

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: | 
          workspace/out/target/product/${{ steps.gdt.outputs.MAKEFILE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ steps.gdt.outputs.MAKEFILE_NAME }}/*.zip
          workspace/out/target/product/${{ steps.gdt.outputs.MAKEFILE_NAME }}/*vendor*.img
        name: ${{ steps.gdt.outputs.MAKEFILE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ steps.gdt.outputs.MAKEFILE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
