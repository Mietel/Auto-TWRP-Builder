name: Recovery Build (Legacy)

on:
  workflow_dispatch:
    inputs:
      DEVICE_VARIANT:
        description: 'Device profile'
        required: true
        type: choice
        options:
          - ultra14
          - 18t12
        default: ultra14
      IMG_URL:
        description: 'Optional stock input ZIP override'
        required: false
        default: ''
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: false
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'Optional manifest branch override'
        required: false
        default: ''
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'boot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ALLOW_MISSING_DEPENDENCIES: 'true'
      BUILD_BROKEN_MISSING_REQUIRED_MODULES: 'true'
      SOONG_ALLOW_MISSING_DEPENDENCIES: 'true'
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Device variant: ${{ github.event.inputs.DEVICE_VARIANT }}"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v4
    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python3
        sudo apt -y install python3 python3-pip cpio wget
        pip3 install twrpdtgen
    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'
    - name: Configure build memory
      run: |
        set -euo pipefail
        if ! swapon --show=NAME | grep -qx '/swapfile'; then
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
        fi
        free -h
        swapon --show

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.5.4
      with:
          ssh-private-key: |
              ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        set -euo pipefail
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        if [[ "${{ github.event.inputs.DEVICE_VARIANT }}" == "ultra14" ]]; then
          DEFAULT_BRANCH=twrp-14.1
        else
          DEFAULT_BRANCH=twrp-12.1
        fi
        MANIFEST_BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"
        if [[ -z "$MANIFEST_BRANCH" ]]; then
          MANIFEST_BRANCH="$DEFAULT_BRANCH"
        fi
        echo "manifest_branch=$MANIFEST_BRANCH" >> $GITHUB_OUTPUT
        git config --global user.name "azwhikaru"
        git config --global user.email "azwhikaru+37921907@github.com"
        repo init --depth=1 -u "${{ github.event.inputs.MANIFEST_URL }}" -b "$MANIFEST_BRANCH"
      id: pwd

    - name: Check Build Tree
      id: buildtree
      run: |
        if [[ "${{ steps.pwd.outputs.manifest_branch }}" == twrp-* ]]; then
          echo "value=twrp" >> "$GITHUB_OUTPUT"
        else
          echo "value=omni" >> "$GITHUB_OUTPUT"
        fi


    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace
    - name: Generate Device Tree
      run: |
        set -euo pipefail
        case "${{ github.event.inputs.DEVICE_VARIANT }}" in
          ultra14)
            DEFAULT_IMG_URL=https://github.com/Mietel/Auto-TWRP-Builder/releases/download/ultra-input/ultra14-input.zip
            TREE_REPO=https://github.com/Mietel/Power_Armor_18T_Ultra.git
            DEVICE_TREE=device/ulefone/Power_Armor_18T_Ultra
            PRODUCT_NAME=Power_Armor_18T_Ultra
            MAKEFILE_NAME=twrp_Power_Armor_18T_Ultra
            ;;
          18t12)
            DEFAULT_IMG_URL=https://github.com/Mietel/Auto-TWRP-Builder/releases/download/18t-input/18t-input.zip
            TREE_REPO=https://github.com/Mietel/Power_Armor_18T.git
            DEVICE_TREE=device/ulefone/Power_Armor_18T
            PRODUCT_NAME=Power_Armor_18T
            MAKEFILE_NAME=twrp_Power_Armor_18T
            ;;
          *)
            echo "Unknown DEVICE_VARIANT"
            exit 1
            ;;
        esac
        IMG_URL="${{ github.event.inputs.IMG_URL }}"
        if [[ -z "$IMG_URL" ]]; then
          IMG_URL="$DEFAULT_IMG_URL"
        fi
        wget -O input.zip "$IMG_URL"
        unzip -o input.zip
        mapfile -t IMAGES < <(find . -maxdepth 1 -type f -iname '*.img' -print)
        if [ "${#IMAGES[@]}" -ne 1 ]; then
          echo "Expected exactly one stock input image, found ${#IMAGES[@]}:"
          printf ' - %s\n' "${IMAGES[@]}"
          exit 1
        fi
        git clone --depth=1 "$TREE_REPO" "$DEVICE_TREE"
        test -f "$DEVICE_TREE/AndroidProducts.mk"
        test -f "$DEVICE_TREE/BoardConfig.mk"
        test -s "$DEVICE_TREE/prebuilt/kernel"
        test -s "$DEVICE_TREE/prebuilt/dtb.img"
        grep -q "$MAKEFILE_NAME" "$DEVICE_TREE/AndroidProducts.mk"
        grep -q 'TARGET_PREBUILT_KERNEL' "$DEVICE_TREE/BoardConfig.mk"
        echo "DEVICE_NAME=ulefone" >> "$GITHUB_OUTPUT"
        echo "PRODUCT_NAME=$PRODUCT_NAME" >> "$GITHUB_OUTPUT"
        echo "MAKEFILE_NAME=$MAKEFILE_NAME" >> "$GITHUB_OUTPUT"
        echo "DEVICE_PATH=$DEVICE_TREE" >> "$GITHUB_OUTPUT"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      id: gdt

    - name: Sync Device Dependencies
      run: |
        set -euo pipefail
        DEPENDENCIES="${{ steps.gdt.outputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies"
        if [ -f "$DEPENDENCIES" ]; then
          bash ${GITHUB_WORKSPACE}/scripts/convert.sh "$DEPENDENCIES"
        else
          echo "No device dependencies file found; continuing with the manifest dependencies."
        fi
        repo sync -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        set -eo pipefail
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export BUILD_BROKEN_MISSING_REQUIRED_MODULES=true
        export SOONG_ALLOW_MISSING_DEPENDENCIES=true
        DEVICE_TREE="${{ steps.gdt.outputs.DEVICE_PATH }}"
        test -f "$DEVICE_TREE/AndroidProducts.mk"
        PRODUCT_NAME=$(sed -n 's|.*$(LOCAL_DIR)/\([^[:space:]]*\)\.mk.*|\1|p' "$DEVICE_TREE/AndroidProducts.mk" | head -n 1)
        test -n "$PRODUCT_NAME"
        if [[ "${{ steps.pwd.outputs.manifest_branch }}" == twrp-* ]]; then
          if [[ "${{ steps.pwd.outputs.manifest_branch }}" == "twrp-14.1" ]]; then
            lunch "$PRODUCT_NAME-ap2a-eng"
          else
            lunch "$PRODUCT_NAME-eng"
          fi
        else
          lunch "$PRODUCT_NAME-eng"
        fi
        PRODUCT_OUTPUT="out/target/product/${{ steps.gdt.outputs.PRODUCT_NAME }}"
        IMAGE_PATH="$PRODUCT_OUTPUT/${{ github.event.inputs.BUILD_TARGET }}.img"
        mkdir -p "$PRODUCT_OUTPUT"
        if [[ "${{ github.event.inputs.DEVICE_VARIANT }}" == "ultra14" && "${{ github.event.inputs.BUILD_TARGET }}" == "boot" && -s "$DEVICE_TREE/prebuilt/boot-twrp-havoc-ultra14.img" ]]; then
          echo "Using verified Havoc Ultra prebuilt image"
          cp "$DEVICE_TREE/prebuilt/boot-twrp-havoc-ultra14.img" "$IMAGE_PATH"
        else
          make ${{ github.event.inputs.BUILD_TARGET }}image -j2 2>&1 | tee build.log
        fi
        test -s "$IMAGE_PATH"
        if [[ "${{ github.event.inputs.BUILD_TARGET }}" == "boot" ]]; then
          PARTITION_SIZE=$(awk '$1 == "BOARD_BOOTIMAGE_PARTITION_SIZE" {print $3; exit}' "$DEVICE_TREE/BoardConfig.mk")
          STOCK_IMAGE=$(find . -maxdepth 1 -type f -iname '*.img' -print -quit)
          test -n "$STOCK_IMAGE"
          python3 - "$STOCK_IMAGE" "$IMAGE_PATH" "$PARTITION_SIZE" <<'PY'
        import struct
        import sys
        from pathlib import Path

        stock_image = Path(sys.argv[1])
        image = Path(sys.argv[2])
        partition_size = int(sys.argv[3]) if sys.argv[3].isdigit() else None
        stock_data = stock_image.read_bytes()
        data = image.read_bytes()
        if data[:8] != b"ANDROID!":
            raise SystemExit("Output is not an Android boot image")
        page_size = struct.unpack_from("<I", data, 36)[0]
        header_version = struct.unpack_from("<I", data, 40)[0]
        if page_size != 2048:
            raise SystemExit(f"Unexpected boot page size: {page_size}")
        if header_version != 2:
            raise SystemExit(f"Unexpected boot header version: {header_version}")
        if partition_size is not None and image.stat().st_size > partition_size:
            raise SystemExit(
                f"Image is {image.stat().st_size} bytes, boot partition is {partition_size} bytes"
            )
        stock_has_avb = len(stock_data) >= 64 and stock_data[-64:-60] == b"AVBf"
        output_has_avb = len(data) >= 64 and data[-64:-60] == b"AVBf"
        print(
            f"Validated Android boot image: {image} ({image.stat().st_size} bytes); "
            f"stock AVB footer present={stock_has_avb}, "
            f"output AVB footer present={output_has_avb}"
        )
        PY
        fi
        echo "Built image: $IMAGE_PATH"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload build diagnostics
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: build-diagnostics-${{ github.run_id }}
        if-no-files-found: ignore
        path: |
          workspace/build.log
          workspace/out/soong.log
          workspace/out/soong/soong.log
          workspace/out/.ninja_log

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: | 
          workspace/out/target/product/${{ steps.gdt.outputs.PRODUCT_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ steps.gdt.outputs.PRODUCT_NAME }}/*.zip
          workspace/out/target/product/${{ steps.gdt.outputs.PRODUCT_NAME }}/*vendor*.img
        name: ${{ steps.gdt.outputs.PRODUCT_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ steps.gdt.outputs.MAKEFILE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
